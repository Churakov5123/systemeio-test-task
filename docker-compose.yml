services:
    sio_test:
        user: app
        build:
            context: .
            args:
                USER_ID: ${USER_ID:-1000}
        ports:
            - "8337:8337"
        volumes:
            - .:/app:rw
        environment:
            - APP_ENV=dev

    db_postgres:
        image: postgres:15
        restart: always
        env_file: .env
        environment:
            POSTGRES_DB: my_database
            POSTGRES_USER: my_pg_user
            POSTGRES_PASSWORD: pg_user
        volumes:
            - db_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
    db_mysql:
        image: mysql:8.0
        restart: always
        container_name: mysql
        env_file: .env
        environment:
            - MYSQL_DATABASE=my_database
            - MYSQL_USER=mysql_user
            - MYSQL_PASSWORD=mysql_pass
            - MYSQL_ROOT_PASSWORD=mysql_pass
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3306:3306"
volumes:
    db_data: